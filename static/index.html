<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kanban Task Tracker</title>
  <style>
    :root {
      --bg: #f4f5f7;
      --surface: #ffffff;
      --border: #dfe1e6;
      --text: #172b4d;
      --text-muted: #6b778c;
      --accent: #0052cc;
      --danger: #de350b;
      --todo: #6b778c;
      --in-progress: #0052cc;
      --done: #00875a;
      --radius: 8px;
      --shadow: 0 1px 3px rgba(9, 30, 66, 0.15);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 24px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
      flex-wrap: wrap;
      gap: 16px;
    }

    h1 { font-size: 1.4rem; }

    /* --- New task form --- */
    #task-form {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    #task-form input {
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: 0.9rem;
      background: var(--surface);
    }

    #task-title { width: 220px; }
    #task-description { width: 280px; }

    #task-form button {
      padding: 8px 16px;
      border: none;
      border-radius: var(--radius);
      background: var(--accent);
      color: #fff;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
    }

    #task-form button:hover { filter: brightness(1.1); }

    /* --- Board --- */
    #board {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      align-items: start;
    }

    @media (max-width: 800px) {
      #board { grid-template-columns: 1fr; }
    }

    .column {
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 12px;
      min-height: 320px;
      display: flex;
      flex-direction: column;
    }

    .column h2 {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      padding: 4px 8px 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .column h2::before {
      content: "";
      width: 10px;
      height: 10px;
      border-radius: 50%;
      display: inline-block;
    }

    .column[data-status="todo"] h2::before { background: var(--todo); }
    .column[data-status="in_progress"] h2::before { background: var(--in-progress); }
    .column[data-status="done"] h2::before { background: var(--done); }

    .task-count {
      margin-left: auto;
      background: var(--bg);
      border-radius: 10px;
      padding: 1px 8px;
      font-size: 0.75rem;
    }

    .task-list {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 8px;
      border-radius: var(--radius);
      transition: background 0.15s;
      padding: 4px;
    }

    /* Drop-target feedback: green for legal targets, red for illegal ones. */
    .column.drop-allowed .task-list { background: rgba(0, 135, 90, 0.12); outline: 2px dashed var(--done); }
    .column.drop-forbidden .task-list { background: rgba(222, 53, 11, 0.10); outline: 2px dashed var(--danger); }

    /* --- Cards --- */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 12px;
      cursor: grab;
      box-shadow: var(--shadow);
    }

    .card.dragging { opacity: 0.5; }

    .card-title { font-size: 0.95rem; font-weight: 600; overflow-wrap: anywhere; }

    .card-description {
      font-size: 0.82rem;
      color: var(--text-muted);
      margin-top: 4px;
      overflow-wrap: anywhere;
    }

    .card-actions {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }

    .card-actions button {
      border: none;
      background: none;
      color: var(--text-muted);
      font-size: 0.78rem;
      cursor: pointer;
      padding: 2px 4px;
      border-radius: 4px;
    }

    .card-actions button:hover { background: var(--bg); color: var(--text); }
    .card-actions button.delete-btn:hover { color: var(--danger); }

    /* --- Toast --- */
    #toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--danger);
      color: #fff;
      padding: 10px 18px;
      border-radius: var(--radius);
      font-size: 0.9rem;
      box-shadow: var(--shadow);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s;
    }

    #toast.visible { opacity: 1; }
  </style>
</head>
<body>
  <header>
    <h1>Kanban Task Tracker</h1>
    <form id="task-form">
      <input id="task-title" type="text" placeholder="Task title" required maxlength="200" />
      <input id="task-description" type="text" placeholder="Description (optional)" maxlength="2000" />
      <button type="submit">Add Task</button>
    </form>
  </header>

  <main id="board">
    <section class="column" data-status="todo">
      <h2>To Do <span class="task-count">0</span></h2>
      <div class="task-list"></div>
    </section>
    <section class="column" data-status="in_progress">
      <h2>In Progress <span class="task-count">0</span></h2>
      <div class="task-list"></div>
    </section>
    <section class="column" data-status="done">
      <h2>Done <span class="task-count">0</span></h2>
      <div class="task-list"></div>
    </section>
  </main>

  <div id="toast" role="alert"></div>

  <script src="/static/app.js"></script>
</body>
</html>

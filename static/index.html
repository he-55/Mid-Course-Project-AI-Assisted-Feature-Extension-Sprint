<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kanban Task Tracker</title>
  <style>
    :root {
      --bg: #f4f5f7;
      --surface: #ffffff;
      --border: #dfe1e6;
      --text: #172b4d;
      --text-muted: #6b778c;
      --accent: #0052cc;
      --danger: #de350b;
      --todo: #6b778c;
      --in-progress: #0052cc;
      --done: #00875a;
      --radius: 8px;
      --shadow: 0 1px 3px rgba(9, 30, 66, 0.15);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 24px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
      flex-wrap: wrap;
      gap: 16px;
    }

    h1 { font-size: 1.4rem; }

    /* --- New task form --- */
    #task-form {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    #task-form input {
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: 0.9rem;
      background: var(--surface);
    }

    #task-title { width: 200px; }
    #task-description { width: 220px; }
    #task-due-date { width: 150px; color: var(--text); }
    #task-tags { width: 190px; }

    #task-form button {
      padding: 8px 16px;
      border: none;
      border-radius: var(--radius);
      background: var(--accent);
      color: #fff;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
    }

    #task-form button:hover { filter: brightness(1.1); }

    /* --- Filter + search bar --- */
    :root { --warning: #b25b00; --highlight: #ffe380; }

    #filter-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      flex-wrap: wrap;
      align-items: center;
    }

    /* --- Search --- */
    #search-wrap {
      position: relative;
      display: inline-flex;
      align-items: center;
      margin-left: auto;
    }

    #search-icon {
      position: absolute;
      left: 10px;
      color: var(--text-muted);
      pointer-events: none;
      display: flex;
    }

    #search-input {
      width: 240px;
      padding: 7px 32px 7px 34px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--surface);
      font-size: 0.85rem;
      color: var(--text);
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    #search-input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(0, 82, 204, 0.15);
    }

    /* Hide the browser's native clear control; we provide our own. */
    #search-input::-webkit-search-cancel-button { display: none; }

    #search-clear {
      position: absolute;
      right: 8px;
      border: none;
      background: none;
      color: var(--text-muted);
      font-size: 0.9rem;
      line-height: 1;
      cursor: pointer;
      padding: 4px;
      border-radius: 50%;
    }

    #search-clear:hover { background: var(--bg); color: var(--text); }

    #match-counter {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 5px 12px;
      white-space: nowrap;
    }

    /* --- Search result states --- */
    mark.search-hit {
      background: var(--highlight);
      color: #172b4d;
      border-radius: 2px;
      padding: 0 1px;
    }

    .card { animation: card-in 0.18s ease; }

    @keyframes card-in {
      from { opacity: 0; transform: translateY(4px) scale(0.98); }
      to { opacity: 1; transform: none; }
    }

    .card.search-hidden { display: none; }

    .empty-state {
      border: 2px dashed var(--border);
      border-radius: var(--radius);
      padding: 20px 12px;
      text-align: center;
      font-size: 0.85rem;
      color: var(--text-muted);
      animation: card-in 0.18s ease;
    }

    .filter-pill {
      padding: 6px 14px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--surface);
      color: var(--text-muted);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }

    .filter-pill:hover { background: var(--bg); color: var(--text); }

    .filter-pill.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    /* --- Board --- */
    #board {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      align-items: start;
    }

    @media (max-width: 800px) {
      #board { grid-template-columns: 1fr; }
    }

    .column {
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 12px;
      min-height: 320px;
      display: flex;
      flex-direction: column;
    }

    .column h2 {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      padding: 4px 8px 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .column h2::before {
      content: "";
      width: 10px;
      height: 10px;
      border-radius: 50%;
      display: inline-block;
    }

    .column[data-status="todo"] h2::before { background: var(--todo); }
    .column[data-status="in_progress"] h2::before { background: var(--in-progress); }
    .column[data-status="done"] h2::before { background: var(--done); }

    .task-count {
      margin-left: auto;
      background: var(--bg);
      border-radius: 10px;
      padding: 1px 8px;
      font-size: 0.75rem;
    }

    .task-list {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 8px;
      border-radius: var(--radius);
      transition: background 0.15s;
      padding: 4px;
    }

    /* Drop-target feedback: green for legal targets, red for illegal ones. */
    .column.drop-allowed .task-list { background: rgba(0, 135, 90, 0.12); outline: 2px dashed var(--done); }
    .column.drop-forbidden .task-list { background: rgba(222, 53, 11, 0.10); outline: 2px dashed var(--danger); }

    /* --- Cards --- */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 12px;
      cursor: grab;
      box-shadow: var(--shadow);
    }

    .card.dragging { opacity: 0.5; }

    /* Due-date urgency states. .done always wins (set only on Done-column cards). */
    .card.overdue { border-left: 4px solid var(--danger); }
    .card.due-soon { border-left: 4px solid var(--warning); }

    .due-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      margin-top: 8px;
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 0.75rem;
      font-weight: 600;
      background: var(--bg);
      color: var(--text-muted);
    }

    .due-badge.overdue { background: rgba(222, 53, 11, 0.12); color: var(--danger); }
    .due-badge.due-soon { background: rgba(178, 91, 0, 0.12); color: var(--warning); }
    .due-badge.done { background: rgba(0, 135, 90, 0.12); color: var(--done); }

    /* --- Tag chips --- */
    .tag-row {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: 8px;
    }

    .tag-chip {
      border: none;
      cursor: pointer;
      font-size: 0.72rem;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 10px;
      line-height: 1.5;
    }

    .tag-chip:hover { filter: brightness(0.92); }

    /* Deterministic per-tag palette (hash → hue class). */
    .tag-hue-0 { background: #deebff; color: #0747a6; }
    .tag-hue-1 { background: #e3fcef; color: #006644; }
    .tag-hue-2 { background: #fffae6; color: #974f0c; }
    .tag-hue-3 { background: #eae6ff; color: #403294; }
    .tag-hue-4 { background: #ffebe6; color: #bf2600; }
    .tag-hue-5 { background: #e6fcff; color: #00627a; }

    #active-tag-pill {
      background: var(--text);
      border-color: var(--text);
      color: #fff;
    }

    .card-title { font-size: 0.95rem; font-weight: 600; overflow-wrap: anywhere; }

    .card-description {
      font-size: 0.82rem;
      color: var(--text-muted);
      margin-top: 4px;
      overflow-wrap: anywhere;
    }

    .card-actions {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }

    .card-actions button {
      border: none;
      background: none;
      color: var(--text-muted);
      font-size: 0.78rem;
      cursor: pointer;
      padding: 2px 4px;
      border-radius: 4px;
    }

    .card-actions button:hover { background: var(--bg); color: var(--text); }
    .card-actions button.delete-btn:hover { color: var(--danger); }

    /* --- Toast --- */
    #toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--danger);
      color: #fff;
      padding: 10px 18px;
      border-radius: var(--radius);
      font-size: 0.9rem;
      box-shadow: var(--shadow);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s;
    }

    #toast.visible { opacity: 1; }
  </style>
</head>
<body>
  <header>
    <h1>Kanban Task Tracker</h1>
    <form id="task-form">
      <input id="task-title" type="text" placeholder="Task title" required maxlength="200" />
      <input id="task-description" type="text" placeholder="Description (optional)" maxlength="2000" />
      <input id="task-due-date" type="date" title="Due date (optional)" />
      <input id="task-tags" type="text" placeholder="Tags (comma-separated)" title="Tags, comma-separated" />
      <button type="submit">Add Task</button>
    </form>
  </header>

  <nav id="filter-bar" aria-label="Task filters">
    <button type="button" class="filter-pill active" data-filter="all">All Tasks</button>
    <button type="button" class="filter-pill" data-filter="overdue">Overdue</button>
    <button type="button" class="filter-pill" data-filter="soon">Due Soon</button>
    <button type="button" class="filter-pill" data-filter="none">No Due Date</button>
    <button type="button" class="filter-pill" id="active-tag-pill" hidden
            title="Clear tag filter"></button>
    <span id="match-counter" hidden></span>
    <div id="search-wrap">
      <span id="search-icon" aria-hidden="true">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2.5" stroke-linecap="round">
          <circle cx="11" cy="11" r="7"></circle>
          <line x1="21" y1="21" x2="16.5" y2="16.5"></line>
        </svg>
      </span>
      <input id="search-input" type="search" placeholder="Search tasks…  ( / )"
             aria-label="Search tasks" autocomplete="off" />
      <button type="button" id="search-clear" aria-label="Clear search" hidden>✕</button>
    </div>
  </nav>

  <main id="board">
    <section class="column" data-status="todo">
      <h2>To Do <span class="task-count">0</span></h2>
      <div class="task-list"></div>
    </section>
    <section class="column" data-status="in_progress">
      <h2>In Progress <span class="task-count">0</span></h2>
      <div class="task-list"></div>
    </section>
    <section class="column" data-status="done">
      <h2>Done <span class="task-count">0</span></h2>
      <div class="task-list"></div>
    </section>
  </main>

  <div id="toast" role="alert"></div>

  <script src="/static/app.js"></script>
</body>
</html>
